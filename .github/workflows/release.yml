name: Publish docus

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and build tools
        run: python -m pip install --upgrade . build pytest-xdist
      - name: Test
        run: python testing_suite_client.py
      - name: Verify tag and build clean distributions
        run: |
          python - <<PY
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != "v" + version:
              raise SystemExit(f"Release tag {tag} does not match package version {version}")
          PY
          rm -rf dist build
          python -m build
          python - <<PY
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          files = sorted(path.name for path in Path("dist").iterdir())
          if len(files) != 2 or any(not name.startswith("docus-" + version) for name in files):
              raise SystemExit(f"Unexpected distribution files: {files}")
          print("Publishing:", *files)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
